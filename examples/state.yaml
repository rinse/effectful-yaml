# std.set で設定, std.get で取得
set-and-get:
  $do:
  - $std.set: {x: hello}
  - $std.set: {x: world}
  - $std.get: x

# uninitialized cell error をハンドラで回収するには、
# そのセルを解決する状態ハンドラの位置を内側に持ち込む必要がある。
catch-uninitialized-cell-error:
  $handler: {$std.state: {}} # 状態ハンドラの宣言
  $in:
    $std.get: x
  $default: Uninitialized value!

# $handler: {$std.state: ...} で std.get・std.set のスコープを明示する。
# 状態の初期値も与えられる。リストを本体にするときは $in に書く。
nested-states:
  $handler: {$std.state: {x: hello, y: world, z: beautiful}}
  $in:
  - $std.get: x
  - $handler: {$std.state: {x: bonjour, y: monde}}
    $in:
      $do:
      - $std.set: {y: marie}
      - - $std.get: x
        - $std.get: y
  - $std.get: y

# $handler: {$std.state: ...} を $do の文に置けば、状態のスコープはそれ以後の文全体になる。
with-do:
  $do:
  - $handler: {$std.state: {x: hello, y: world}}
  - - $std.get: x
    - $std.get: y
