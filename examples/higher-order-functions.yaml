$do:
- $let:
    double: {$param: x, $fn: "${x * 2}"}
    # 引数で関数を受ける高階関数
    twice:
      $param: [f, x] # 複数引数はカリー化されるので、実質的に関数を返す高階関数でもある
      $fn:
        $let: {y: {$.f: "${x}"}}  # $let と同じレキシカルな束縛なので、同じように呼べる
        $in: {$.f: "${y}"}
    # 関数を返す高階関数
    adder:
      $param: n
      $fn: {$param: x, $fn: "${x + n}"}
- $let:
    step: {$.twice: "${double}"}  # 部分適用。名前で渡す（${...} 参照）
    add3: {$.adder: 3}
- - {$.step: 10}
  - {$.add3: 10}
