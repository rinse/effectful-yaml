# オブジェクトの value に対する map
mapValues:
  $handler: ${std.mapping}
  $in:
    $let:
      a: {$std.each: {x: hello, y: world}}
    $in:
      key: ${a.key}
      value: "${a.value}, world"

# オブジェクトの key に対する map
mapKeys:
  $handler: ${std.mapping}
  $in:
    $let:
      a: {$std.each: {x: hello, y: world}}
    $in:
      key: "${a.key}1"
      value: ${a.value}

lookingUp:
  $let:
    obj: { x: 10, y: 100 }
  $in:
    $std.lookup:
      key: x
      in: ${obj}
