# 自分で定義した作用をハンドルする
handling-user-defined-effects:
  $with:
    # eff.throw 作用の定義
    # eff は名前空間
    eff.throw:
      $fn: msg
      $body:
        # 例外処理を行う (ログを出して代替の値で続行 or エラー落ちさせる)
        $do:
          - $std.log: "[WARN] ${msg}"
          - $resume: Beautiful
        # $std.fail: ${msg} # $do の代わりに置くと、メッセージを出して失敗させる
  # 残りのキーが本体
  key1: Hello!
  key2:
    # eff.throw 作用の利用
    $eff.throw: Error!
  key3: World!

# 標準演算 std.each をハンドルする
handling-system-defined-effects:
  $with:
    std.each:
      $fn: xs
      $body:
        $std.list:
          $std.for:
            x: ${xs}
          $in:
            $resume: ${x * 2}
  key1: Hello!
  key2: {$std.each: [1, 2, 3]}
  key3: World!

# $std.for は $let と $std.each への展開なので、std.each の節がそのまま処理する
handling-for:
  $with:
    std.each:
      $fn: xs
      $body:
        $std.list:
          $std.for:
            x: ${xs}
          $in:
            $resume: ${x * 2}
  $std.for:
    n: [1, 2, 3]
  key1: Hello!
  key2: ${n}
  key3: World!
