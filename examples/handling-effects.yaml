# 自分で定義した作用をハンドルする
handling-user-defined-effects:
  $handler:
    # throw 作用の定義（ローカル作用の宣言）
    throw:
      $fn: msg
      $body:
        # 例外処理を行う (ログを出して代替の値で続行 or エラー落ちさせる)
        $do:
          - $std.log: "[WARN] ${msg}"
          - $resume: Beautiful
        # $std.fail: ${msg} # $do の代わりに置くと、メッセージを出して失敗させる
  # 残りのキーが本体
  key1: Hello!
  key2:
    # throw 作用の利用
    $.throw: Error!
  key3: World!

# 標準演算 std.each をハンドルする
handling-system-defined-effects:
  $handler:
    std.each:
      $fn: xs
      $body:
        $handler: ${std.list}
        $in:
          $for:
            x: ${xs}
          $in:
            $resume: ${x * 2}
  key1: Hello!
  key2: {$std.each: [1, 2, 3]}
  key3: World!

# $for は $let と std.each への展開なので、std.each の節がそのまま処理する
handling-for:
  $handler:
    std.each:
      $fn: xs
      $body:
        $handler: ${std.list}
        $in:
          $for:
            x: ${xs}
          $in:
            $resume: ${x * 2}
  $for:
    n: [1, 2, 3]
  key1: Hello!
  key2: ${n}
  key3: World!
