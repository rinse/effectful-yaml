without-default:
  # std.fail を $default で捕まえる。既定値は null
  $do:
  - $std.log: "[DEBUG] Hello, without default!"
  - $std.fail: Oh no!
  $default: null

with-default:
  $do:
  - $std.log: "[DEBUG] Hello, with default!"
  - $std.fail: Oh no!
  $default: Good to go!

# $default がないと、文書全体がエラーで落ちる
# error:
#   $do:
#   - $std.log: "[DEBUG] Hello, error!"
#   - $std.fail: Oh no!
