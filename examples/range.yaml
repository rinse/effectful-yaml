# hello を 100 個並べたリストに評価される。
#
# 反復はデータ構造に沿って書く。数を構造に変えるのが第一階の標準演算 $std.range で、
# その構造を回るのが畳み込みのカーネル構文 $collect である。
# $collect は要素ごとの結果リストを連結するので、各要素で一要素のリストを返せば
# 長さ 100 のリストになる（作用は起きないので、この文書は分岐しない）。
#
# 言語は fix に相当する原始を持たず、$let も非再帰なので、反復をこの形以外で書く道はない。
$collect: {$std.range: 100}
$with:
  $fn: i
  $body:
  - hello
