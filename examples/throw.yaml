# 代数的作用とハンドラの例。
# exn.throw は呼び出しの場所で名指しするだけの抽象的な演算で、それ自体は意味を持たない。
# 「エラー終了」という意味は、$handle の節が標準の失敗への翻訳として与える。
# 長い名前には、引数を素通しする $fn を $let で束縛して短いローカル名を付ける。
$let:
  throw:
    $fn: msg
    $body:
      $exn.throw: ${msg}
$in:
  $handle:
    $do:
    - $std.log: start
    - {$.throw: error message}
    - $std.log: unreachable    # 節が $resume を呼ばないので、ここには到達しない
  $with:
    exn.throw:
      $fn: msg
      $body:
        # 打ち切って標準の失敗に翻訳する。CLI はこれを受けて終了コード 1 で止まる。
        # ここを既定値に置き換えれば、同じ本体のまま回復の意味に変わる。
        $std.fail: ${msg}
